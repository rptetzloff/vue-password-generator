# ONE service definition, applied by TWO Blueprints. That is the thing to
# understand before editing this file, and it is not obvious from the file.
#
#   Blueprint tracking main -> creates `wordlock`       -> wordlock.net
#   Blueprint tracking dev  -> creates `wordlock-<sfx>`  -> dev.wordlock.net
#
# Each Blueprint applies the WHOLE file and appends ITS OWN suffix to every
# service it creates. The suffix belongs to the Blueprint, not to the service:
# one sync offered `wordlock-cl9q` and `wordlock-dev-cl9q` together -- two
# services, one suffix -- and recreating that Blueprint changed it to `-bumy`
# for everything it made thereafter. So it was never a collision suffix, and
# the name here is a stem rather than the name you will see in the dashboard.
#
# The useful half of that: within one Blueprint the naming is deterministic, so
# a review screen can be read before it is approved, and a name you did not
# expect means the entry is not the one you thought.
#
# Two consequences, both learned the hard way in one evening:
#
#   1. NEVER pin `branch:` here. See below.
#   2. ~~Never declare a second service here.~~ ~~Never declare a second
#      service on the environment axis.~~ Declare EVERY service, and pin
#      each one to its branch.
#
#      Both earlier rules were about one entry being applied to two
#      deployments -- first a duplicated production service, then a branch
#      pin imposed where it did not belong. Naming all of them ends that: a
#      service here describes exactly one deployment, and the topology is
#      readable in the repository instead of only in the dashboard, which is
#      where the -cl9q confusion lived.
#
#      THIS REQUIRES EXACTLY ONE BLUEPRINT. Two Blueprints each apply the
#      whole file, so with four services declared you would get eight.
#
#      Only the dev pair is declared today, deliberately. The shape gets
#      proved on the deployment that exists to be broken; site and app on
#      main are added when production is ready to move.

services:
  - type: web
    name: site-dev
    branch: dev

    # The domain lives here rather than only in the dashboard, which is the
    # last piece of this topology that was invisible in the repository.
    # Taken from Render's own export of the running service, so it is what
    # is actually attached rather than what was intended.
    #
    # UNKNOWN, and it matters more for production than here: whether domain
    # sync is additive like the header sync, or authoritative. If it is
    # authoritative, a wrong entry detaches a live domain. Being wrong about
    # that on dev costs a dev site; the same mistake on wordlock.net does
    # not. That is the order these are being done in.
    domains:
      - dev.wordlock.net

    runtime: static

    # ~~NO `branch:` HERE.~~ REVERSED, and the reason the old rule existed is
    # the reason it no longer applies.
    #
    # It was pinned to main once. The dev Blueprint reads THIS FILE from the
    # dev branch and applied everything in it, so `branch: main` was handed to
    # the dev service too. dev.wordlock.net silently served main; switching it
    # in the dashboard worked until the next sync put it back, which is the
    # "why does it keep switching" that went unexplained for weeks. It surfaced
    # as a 404 on a module committed hours earlier: fourteen commits of work
    # had never been on the dev site at all.
    #
    # That was ONE service imposed on TWO deployments, where any pin was wrong
    # for whichever deployment it did not describe. Each deployment is its own
    # entry now, so a pin describes exactly one thing and the ambiguity it
    # used to create is what it now removes.
    #
    # Without a pin the branch comes from the Blueprint's link -- invisible in
    # the repository, which is how the same confusion reached the service
    # NAMES as well. Render's docs say an omitted branch means the repo's
    # DEFAULT branch, which contradicts what was measured here; if that were
    # true, removing the pin would have left dev on main and the bug would
    # have persisted. It did not. Pinning removes the need to know which of
    # those is right.

    # No build step: index.html loads src/main.js as a native ES module and the
    # wordlists are fetched from data/, so the repo is served as-is.
    staticPublishPath: ./site
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()

      # HSTS. The site is HTTPS-only already, but without this a first visit
      # typed as "wordlock.net" is one plaintext request that can be answered
      # by something other than us -- and what it would be answering with is
      # the page someone types a vault passphrase into. Two years, which is
      # the preload floor, and includeSubDomains because dev.wordlock.net
      # serves the same application from the same registrable domain.
      #
      # Deliberately NOT `preload` yet: submitting to the preload list is
      # effectively irreversible on browser timescales, and it would commit
      # every future subdomain of wordlock.net to HTTPS forever. Worth doing,
      # worth doing on purpose rather than as a line in a security pass.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains

      # Content-Security-Policy. For a vault that never talks to a server, the
      # directive that earns its keep is connect-src: even if something did run
      # on this origin, it has nowhere to send what it found. form-action and
      # img-src close the other two classic exfiltration channels (POST to a
      # remote endpoint, and a remote image URL with the secret in the path).
      #
      # The hashes cover the inline <script> blocks -- the offline registration
      # and the theme priming that has to run before first paint. They are NOT
      # hand-maintained: test/csp.test.js recomputes them from the HTML and
      # fails if this header drifts, because a stale hash here is a blank site.
      # Hashing is done over LF-normalized content, which is what git stores
      # and therefore what Render serves; computing them from a CRLF working
      # tree yields hashes that pass locally and break in production.
      #
      # 'unsafe-eval' IS GONE. It was required for as long as components
      # declared templates as strings: Vue compiled those in the browser
      # through `new Function`, and without the allowance every page rendered
      # blank -- measured, not assumed.
      #
      # Templates are now compiled ahead of time by tools/build-templates.mjs
      # and the page ships vue.runtime.esm-browser.prod.js, which has no
      # compiler in it at all. Nothing on this origin needs to build a function
      # from a string any more, so the policy no longer says it may.
      #
      # It was one allowance blocking three separate things -- this policy, a
      # Manifest V3 extension, and the sealing work in 9f -- which is why "do
      # not add a build step for this alone" stopped applying.
      #
      # style-src keeps 'unsafe-inline' because CSP hashes do not cover style
      # attributes and docs.html carries 123 of them. With img-src and
      # connect-src locked to 'self', the usual CSS-exfiltration trick has no
      # egress, so this is the cheap half of the trade rather than the costly
      # one.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-7yZ83kgGuhDmZcvzHbSQrWh2kWiX0qCiG+NFVRVZ3Os=' 'sha256-DiUdl/bSxuigxmZ4zlmHi7PZ/9lyu3agQDuPTNpP3Tg=' 'sha256-EaVGUkNxl9fsZyICvVTMXT93Xw6/rRpzf5S/Vsk4JXU=' 'sha256-KjC9oZKHi4pyhjDms33PMGB9qzHjr4kaAr3jKtwWNq8=' 'sha256-WsEnyTWovzW5y1BIEjwerF3FDMa00hyDoEWBcZeLK2w=' 'sha256-sq7aD+6QKh+pvY7s7mMmZKYHE+qDstyhXCded9Yxluo=' 'sha256-zO1D4Vm447P7kMLJzPE0qTA+yYPRKOkFNGRzejILZdE='"

      # Caching for the vendored third-party assets. Since v2.7.1 these are
      # served from this domain rather than a CDN, so their bytes are ours --
      # and the icon webfont alone is 403 KB, by far the heaviest thing a
      # first-time visitor downloads.
      #
      # Deliberately scoped narrowly. Render does not document what happens
      # when two header rules match the same request, so these paths are kept
      # non-overlapping rather than relying on a precedence guess. (The /*
      # rules above set different header names, so they do not collide with
      # Cache-Control.)
      #
      # That warning was right and the rules broke it anyway: /vendor/* also
      # matched /vendor/mdi/fonts/..., so the font had two rules claiming it.
      # Measured against production and dev on 2026-08-15, five requests each,
      # every one a cf-cache-status: MISS so every one a real origin response:
      # the font came back immutable three times and max-age=86400 twice. The
      # same file, the same deploy, a different answer per request. Reordering
      # the rules changed nothing -- dev, with the order reversed, was equally
      # split. There is no precedence to guess at, so the paths are enumerated
      # instead and no request matches two rules.
      #
      # Anything added under vendor/ therefore needs a line here or it gets no
      # Cache-Control at all. That is the cost of the approach and it is worth
      # it: no header is a knowable default, two headers is a coin flip.
      #
      # AND THE TRAP THAT MADE THIS TAKE ALL AFTERNOON: Blueprint header sync
      # is ADDITIVE. Render adds rules you add and updates rules you change,
      # but deleting one here does NOT delete it from the service. The old
      # /vendor/* rule stayed live and kept competing with the font rule long
      # after it left this file, which is why removing the overlap changed
      # nothing. Deleting a header rule means deleting it here *and* on the
      # service's Headers page. Verified 2026-08-15: after removing the orphan
      # by hand, the font returned immutable five times out of five, and the
      # two LICENSE files -- deliberately uncovered -- fell through to Render's
      # own max-age=0, s-maxage=300 instead of the phantom 86400.
      #
      # Checking this against production needs a cache-busting query, or you
      # measure Cloudflare rather than Render -- a plain request returns the
      # edge copy with cf-cache-status: EXPIRED, which is how the first read of
      # this was wrong in the other direction.
      #
      # Nothing is set for /src or the HTML on purpose: those change every
      # release and carry stable filenames, so they should keep revalidating
      # and pick up deploys immediately.

      # The font is requested with a ?v=7.4.47 query, so the URL changes when
      # the font does. That makes it genuinely safe to treat as immutable, and
      # at 403 KB it is the one asset where a year rather than a day matters.
      - path: /vendor/mdi/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # Vue and the icon stylesheet have stable, unversioned filenames, so they
      # must NOT be immutable -- an upgrade would strand cached copies for as
      # long as the max-age. A day, then revalidate. Named individually rather
      # than as /vendor/*, which would also match the font above.
      - path: /vendor/mdi/css/*
        name: Cache-Control
        value: public, max-age=86400
      # ~~A Cache-Control for vue.runtime.~~ Removed from THIS service: the
      # site loads no Vue, so the file is not in site/ and the rule applied to
      # nothing. Dead config, inherited from duplicating the app's block, and
      # invisible to render-config.test.js -- which checks that rules do not
      # overlap, not that they match anything. check-deploy found it by asking
      # the running service and getting a 404 where a header was expected.

      # The word lists. 239 KB raw, 60 KB compressed, and they change about
      # never -- but they had no rule at all, so they fell through to Render's
      # max-age=0 and every page load revalidated them. Measured on production
      # before adding this.
      #
      # A day rather than a year, and deliberately not immutable: the filenames
      # carry no version, so an updated list has to be able to reach people.
      # Same reasoning as the two rules above, and the same non-overlap
      # discipline -- /data/* claims nothing that /vendor/* does.
      #
      # Worth noting what this is NOT a substitute for. These files are fetched
      # lazily, only by the generators that need them, and they used to be
      # fetched repeatedly: four component-local loaders in main.js each did
      # their own fetch with no cache, so cycling the tabs twice cost nine
      # requests. That was fixed in the code, where it belonged. A cache header
      # would have hidden it.
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400

