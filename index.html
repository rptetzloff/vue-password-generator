<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/password_generator_icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#035f91" />
    <script>
      // App mode (8b): cache-first offline via sw.js. Skipped in dev, where a
      // service worker would fight the dev server's module reloading.
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        addEventListener('load', () => navigator.serviceWorker.register('/sw.js'))
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Set the theme before first paint so dark-mode users never see a white
         flash. Deliberately inline and non-module: a module script is deferred
         and would run after the page has already rendered. src/theme.js takes
         over for changes made at runtime. */
      try {
        var c = JSON.parse(localStorage.getItem('global.theme'));
        if (c !== 'light' && c !== 'dark') c = 'system';
        var dark = c === 'dark' || (c === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var fs = JSON.parse(localStorage.getItem('global.fontScale'));
        if ([112, 125, 150].indexOf(fs) !== -1) document.documentElement.style.fontSize = fs + '%';
        var pal = JSON.parse(localStorage.getItem('global.palette'));
        if (['blue','indigo','violet','fuchsia','rose','emerald','teal','slate','mono'].indexOf(pal) !== -1) document.documentElement.setAttribute('data-palette', pal);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/site-footer.css" />
    <link rel="stylesheet" href="/src/site-header.css" />
    <link rel="stylesheet" href="/src/settings-panel.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/vendor/mdi/css/materialdesignicons.min.css" />
    <title>WordLock — Random Password Generator</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
